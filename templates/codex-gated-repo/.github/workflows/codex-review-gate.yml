name: Codex Review Gate

on:
  pull_request_target:
    types: [edited]
  issue_comment:
    types: [created, edited]
  workflow_dispatch:
    inputs:
      operation:
        description: Operation to run for one pull request
        required: true
        type: choice
        options:
          - reconcile
          - begin-review
        default: reconcile
      pr_number:
        description: Pull request number
        required: true
        type: number
      expected_head_sha:
        description: Exact current 40-character pull request head SHA
        required: true
        type: string
      request_comment_id:
        description: Optional GitHub comment ID used only as an evidence hint
        required: false
        type: string
      request_review:
        description: Post a fresh Codex request during begin-review
        required: false
        type: boolean
        default: true
      limits_profile:
        description: Reviewed evidence limit profile
        required: true
        type: choice
        options:
          - default
          - expanded
        default: default

permissions:
  contents: read
  issues: write
  pull-requests: read
  statuses: write

concurrency:
  group: codex-review-gate-${{ github.repository }}-${{ github.event.pull_request.number || github.event.issue.number || inputs.pr_number }}
  cancel-in-progress: false

jobs:
  codex-review-gate:
    name: codex/github-review-gate
    if: >-
      ${{
        (
          github.event_name == 'workflow_dispatch' &&
          github.ref_type == 'branch' &&
          github.ref_name == github.event.repository.default_branch
        ) ||
        (
          github.event_name == 'issue_comment' &&
          (github.event.action == 'created' || github.event.action == 'edited') &&
          github.event.issue.pull_request &&
          github.event.sender.login == 'chatgpt-codex-connector[bot]' &&
          github.event.sender.type == 'Bot' &&
          github.event.comment.user.login == 'chatgpt-codex-connector[bot]' &&
          github.event.comment.user.type == 'Bot'
        ) ||
        (
          github.event_name == 'pull_request_target' &&
          github.event.action == 'edited' &&
          github.event.changes.base.ref.from &&
          github.event.changes.base.ref.from != github.event.pull_request.base.ref &&
          github.event.pull_request.base.repo.full_name == github.repository &&
          github.event.pull_request.base.ref == github.event.repository.default_branch
        )
      }}
    runs-on: ${{ vars.CODEX_REVIEW_GATE_USE_UBUNTU_LATEST == 'true' && 'ubuntu-latest' || 'ubuntu-slim' }}
    timeout-minutes: 14
    steps:
      - name: Reconcile Codex review evidence
        id: gate
        uses: JoeyTeng/codex-review-gate-action@v2
        env:
          CODEX_REVIEW_GATE_REQUEST_AUTHOR_PERMISSION: ${{ vars.CODEX_REVIEW_GATE_REQUEST_AUTHOR_PERMISSION == 'any' && 'any' || 'write' }}
        with:
          github_token: ${{ github.token }}
          pr_number: ${{ github.event_name == 'workflow_dispatch' && inputs.pr_number || github.event_name == 'pull_request_target' && github.event.pull_request.number || github.event.issue.number }}
          expected_head_sha: ${{ github.event_name == 'workflow_dispatch' && inputs.expected_head_sha || github.event_name == 'pull_request_target' && github.event.pull_request.head.sha || '' }}
          operation: ${{ github.event_name == 'workflow_dispatch' && inputs.operation || 'reconcile' }}
          request_comment_id: ${{ github.event_name == 'workflow_dispatch' && inputs.request_comment_id || github.event_name == 'issue_comment' && github.event.comment.id || '' }}
          request_review: ${{ github.event_name == 'workflow_dispatch' && inputs.operation == 'begin-review' && inputs.request_review || false }}
          limits_profile: ${{ ((github.event_name == 'workflow_dispatch' && inputs.limits_profile == 'expanded') || vars.CODEX_REVIEW_GATE_LIMITS_PROFILE == 'expanded') && 'expanded' || 'default' }}
