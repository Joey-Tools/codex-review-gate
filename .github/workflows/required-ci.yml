name: Required CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  review-gate-state-machine:
    name: Review gate state machine
    runs-on: ubuntu-latest
    steps:
      - name: Reject unexpected repository
        if: ${{ github.repository != 'Joey-Tools/codex-review-gate' }}
        run: exit 1
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: Joey-Tools/codex-review-gate
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"
      - run: npm run check:state-machine
      - run: npm run test:state-machine
      - run: node --test test/required-ci-workflow.test.mjs
