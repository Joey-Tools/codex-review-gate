name: Required CI

on:
  workflow_call:

permissions:
  contents: read

jobs:
  review-gate-state-machine:
    name: Review gate state machine
    runs-on: ubuntu-latest
    steps:
      - name: Reject unexpected repository
        if: ${{ github.repository != 'Joey-Tools/codex-review-gate' }}
        run: exit 1
      - uses: actions/checkout@v4
        with:
          repository: Joey-Tools/codex-review-gate
          ref: ${{ github.sha }}
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
      - run: npm run check
      - run: npm test
      - run: bash -n scripts/release-action-subtree.sh
      - run: shellcheck scripts/release-action-subtree.sh
      - run: node --test test/required-ci-workflow.test.mjs
