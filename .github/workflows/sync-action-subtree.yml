name: Release Action Subtree v2

on:
  push:
    branches:
      - master
    paths:
      - .github/workflows/sync-action-subtree.yml
      - package.json
      - packages/action/**
      - scripts/generate-action-release-provenance.mjs
      - scripts/release-action-subtree.sh
      - docs/release/action-v2-repository-baselines.json
  workflow_dispatch:
    inputs:
      publish_v2:
        description: Publish the fixed signed v2.0.0 release and signed aliases.
        required: true
        default: false
        type: boolean

permissions:
  contents: read

concurrency:
  group: release-action-subtree-v2
  cancel-in-progress: false

jobs:
  reject-invalid-publish:
    name: Reject invalid v2 publication request
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.publish_v2 &&
        (
          github.repository != 'Joey-Tools/codex-review-gate' ||
          github.ref != 'refs/heads/master'
        )
      }}
    permissions: {}
    runs-on: ubuntu-latest
    steps:
      - name: Fail closed outside the exact release source
        run: |
          echo "publish_v2=true requires Joey-Tools/codex-review-gate at refs/heads/master." >&2
          exit 1

  validate:
    name: Validate v2 subtree release candidate
    if: >-
      ${{
        github.repository == 'Joey-Tools/codex-review-gate' &&
        (github.event_name != 'workflow_dispatch' || !inputs.publish_v2)
      }}
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Verify split DAG, repository baselines, and v2 identities
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: scripts/release-action-subtree.sh --check --source-ref "$GITHUB_SHA"

  publish:
    name: Publish signed immutable v2 refs
    if: >-
      ${{
        github.event_name == 'workflow_dispatch' &&
        inputs.publish_v2 &&
        github.repository == 'Joey-Tools/codex-review-gate' &&
        github.ref == 'refs/heads/master'
      }}
    runs-on: ubuntu-latest
    environment: action-v2-release
    steps:
      - name: Check out exact source commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: "20"

      - name: Configure closed HTTPS publication credential
        env:
          ACTION_REPO_PUSH_TOKEN_V2: ${{ secrets.ACTION_REPO_PUSH_TOKEN_V2 }}
        run: |
          set -euo pipefail
          if [ -z "$ACTION_REPO_PUSH_TOKEN_V2" ]; then
            echo "ACTION_REPO_PUSH_TOKEN_V2 is required for the v2 target." >&2
            exit 1
          fi

          credential_config="$RUNNER_TEMP/action-v2-gitconfig"
          umask 077
          : > "$credential_config"
          authorization="$(printf 'x-access-token:%s' "$ACTION_REPO_PUSH_TOKEN_V2" | base64 -w 0)"
          git config --file "$credential_config" \
            http.https://github.com/Joey-Tools/codex-review-gate-action.git.extraheader \
            "AUTHORIZATION: basic $authorization"
          unset ACTION_REPO_PUSH_TOKEN_V2 authorization
          printf 'GIT_CONFIG_GLOBAL=%s\n' "$credential_config" >> "$GITHUB_ENV"
          printf 'ACTION_REPO_PUSH_AUTHENTICATED_V2=1\n' >> "$GITHUB_ENV"

      - name: Import and bind the v2 OpenPGP signing key
        env:
          ACTION_RELEASE_SIGNING_PRIVATE_KEY_V2: ${{ secrets.ACTION_RELEASE_SIGNING_PRIVATE_KEY_V2 }}
          EXPECTED_FINGERPRINT: ${{ secrets.ACTION_RELEASE_SIGNING_FINGERPRINT_V2 }}
        run: |
          set -euo pipefail
          if [ -z "$ACTION_RELEASE_SIGNING_PRIVATE_KEY_V2" ] || [ -z "$EXPECTED_FINGERPRINT" ]; then
            echo "ACTION_RELEASE_SIGNING_PRIVATE_KEY_V2 and ACTION_RELEASE_SIGNING_FINGERPRINT_V2 are required." >&2
            exit 1
          fi

          signing_home="$RUNNER_TEMP/action-v2-gnupg"
          install -d -m 700 "$signing_home"
          export GNUPGHOME="$signing_home"
          printf '%s' "$ACTION_RELEASE_SIGNING_PRIVATE_KEY_V2" | gpg --batch --import
          unset ACTION_RELEASE_SIGNING_PRIVATE_KEY_V2

          expected="$(printf '%s' "$EXPECTED_FINGERPRINT" | tr -d '[:space:]' | tr '[:lower:]' '[:upper:]')"
          actual="$(gpg --batch --with-colons --list-secret-keys "$expected" | awk -F: '$1 == "fpr" { print toupper($10); exit }')"
          if [ -z "$actual" ] || [ "$actual" != "$expected" ]; then
            echo "Imported OpenPGP primary fingerprint does not match release policy." >&2
            exit 1
          fi
          printf 'GNUPGHOME=%s\n' "$signing_home" >> "$GITHUB_ENV"
          printf 'ACTION_RELEASE_SIGNING_FINGERPRINT_V2=%s\n' "$expected" >> "$GITHUB_ENV"

      - name: Atomically publish v2 refs and provenance
        env:
          EXPECTED_SOURCE_COMMIT: ${{ github.sha }}
        run: >-
          scripts/release-action-subtree.sh
          --publish
          --source-ref "$GITHUB_SHA"
          --output "$RUNNER_TEMP/codex-review-gate-action-v2.0.0-provenance.json"

      - name: Upload v2 release provenance
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: codex-review-gate-action-v2.0.0-provenance
          path: ${{ runner.temp }}/codex-review-gate-action-v2.0.0-provenance.json
          if-no-files-found: error
          overwrite: false
          retention-days: 90

      - name: Remove ephemeral release credentials
        if: ${{ always() }}
        run: |
          set -euo pipefail
          gpgconf --kill all || true
          rm -f -- "$RUNNER_TEMP/action-v2-gitconfig"
          rm -rf -- "$RUNNER_TEMP/action-v2-gnupg"
