name: Codex Review Gate
description: Verify Codex review evidence or refresh the canonical pull-request verifier.
author: JoeyTeng
branding:
  icon: shield
  color: blue

inputs:
  github_token:
    description: Token used by the verifier to read evidence and by the controller to update diagnostics and rerun the verifier.
    required: true
  pr_number:
    description: Canonical positive pull request number to reconcile.
    required: true
  expected_head_sha:
    description: Exact full pull-request head SHA required by pull_request verification and workflow_dispatch; provider comments bind the current head after refetch.
    required: false
    default: ""
  operation:
    description: "Closed controller operation: reconcile or begin-review; pull_request verification is always reconcile."
    required: false
    default: reconcile
  request_comment_id:
    description: Optional untrusted controller comment hint; it never supplies verifier authority.
    required: false
    default: ""
  request_review:
    description: Whether controller begin-review should post or adopt a canonical OpenAI Codex review request.
    required: false
    default: "true"
  limits_profile:
    description: "Protected-workflow evidence limits profile: default or expanded."
    required: false
    default: default

outputs:
  execution_health:
    description: "Runtime health: healthy or unhealthy."
  gate_outcome:
    description: "Gate result: success, failure, pending, not_applicable, or unknown."
  recovery_code:
    description: Stable machine-readable next-action code.
  retry_safe:
    description: Whether an immediate identical-input retry is a valid recovery action.

runs:
  using: node20
  main: src/v2/gate-runtime.mjs
