name: Codex Review Gate
description: Gate a pull request on complete, trusted current-head Codex review evidence.
author: JoeyTeng
branding:
  icon: shield
  color: blue

inputs:
  github-token:
    description: Token used to read PR review state, create comments, and write commit statuses.
    required: true
  pull-request:
    description: Pull request number to gate.
    required: false
    default: ""
  head-sha:
    description: Deprecated compatibility input. Event-driven runs load the current PR head from GitHub.
    required: false
    default: ""
  status-context:
    description: Commit status context written by the gate.
    required: false
    default: "codex/review-gate"
  state-marker:
    description: Hidden HTML marker used for the sticky state comment.
    required: false
    default: "codex-review-gate-state"
  marker-comment-marker:
    description: Hidden HTML marker used for controlled Codex request comments.
    required: false
    default: "codex-review-gate-marker"
  max-wait-seconds:
    description: Overall marker wait budget used for retry and liveness orchestration.
    required: false
    default: "7200"
  marker-timeout-seconds:
    description: Time to wait for a controlled marker before marking it stalled and retrying.
    required: false
    default: "3600"
  marker-ack-timeout-seconds:
    description: Initial time to wait for Codex to acknowledge a marker before retrying.
    required: false
    default: "300"
  marker-ack-timeout-max-seconds:
    description: Maximum exponential backoff wait for unacknowledged markers.
    required: false
    default: "1800"
  completion-signal-buffer-seconds:
    description: Deprecated v1 interface-compatibility input; accepted values no longer change gate decisions or request orchestration.
    required: false
    default: "30"
  failed-findings-recovery:
    description: Deprecated v1 interface-compatibility switch; accepted values no longer change gate decisions or request orchestration.
    required: false
    default: ""
  failed-findings-recovery-mode:
    description: "Deprecated v1 interface-compatibility input; head and fresh no longer change gate decisions or request orchestration."
    required: false
    default: ""
  poll-interval-seconds:
    description: Deprecated compatibility input. Event-driven runs do not poll.
    required: false
    default: "30"
  bootstrap-grace-seconds:
    description: Deprecated compatibility input. Event-driven runs create controlled markers directly.
    required: false
    default: "60"
  bootstrap-timeout-seconds:
    description: Deprecated compatibility input. Bootstrap now closes after the grace period and starts a controlled marker.
    required: false
    default: "3600"
  codex-bot-logins:
    description: Comma-separated GitHub logins accepted as Codex bot identities.
    required: false
    default: "chatgpt-codex-connector,chatgpt-codex-connector[bot]"
  trusted-comment-logins:
    description: Comma-separated GitHub logins trusted for gate state and marker comments.
    required: false
    default: "github-actions[bot]"
  event-mode:
    description: "Event processing mode: standard, comment-only, or full."
    required: false
    default: ""

outputs:
  producer-receipt-artifact-id:
    description: GitHub artifact ID for the run-attempt producer receipt.
    value: ${{ steps.upload-producer-receipt.outputs.artifact-id }}
  producer-receipt-artifact-url:
    description: GitHub URL for the run-attempt producer receipt artifact.
    value: ${{ steps.upload-producer-receipt.outputs.artifact-url }}
  producer-receipt-artifact-digest:
    description: SHA-256 digest reported for the producer receipt artifact.
    value: ${{ steps.upload-producer-receipt.outputs.artifact-digest }}

runs:
  using: composite
  steps:
    - name: Run Codex review gate
      id: gate
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        GITHUB_REPOSITORY: ${{ github.repository }}
        GITHUB_RUN_ID: ${{ github.run_id }}
        GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
        GITHUB_SERVER_URL: ${{ github.server_url }}
        GITHUB_API_URL: ${{ github.api_url }}
        CODEX_REVIEW_GATE_RECEIPT_PATH: ${{ github.server_url == 'https://github.com' && format('{0}/codex-review-gate-producer-receipt.json', runner.temp) || '' }}
        CODEX_REVIEW_GATE_ACTION_REPOSITORY: ${{ github.action_repository }}
        CODEX_REVIEW_GATE_ACTION_REF: ${{ github.action_ref }}
        CODEX_REVIEW_GATE_WORKFLOW_REF: ${{ github.workflow_ref }}
        CODEX_REVIEW_GATE_WORKFLOW_SHA: ${{ github.workflow_sha }}
        CODEX_REVIEW_GATE_JOB_WORKFLOW_REF: ${{ job.workflow_ref }}
        CODEX_REVIEW_GATE_JOB_WORKFLOW_SHA: ${{ job.workflow_sha }}
        CODEX_REVIEW_GATE_JOB_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
        CODEX_REVIEW_GATE_JOB_WORKFLOW_FILE_PATH: ${{ job.workflow_file_path }}
        PR_NUMBER: ${{ inputs.pull-request }}
        HEAD_SHA: ${{ inputs.head-sha }}
        STATUS_CONTEXT: ${{ inputs.status-context }}
        STATE_MARKER: ${{ inputs.state-marker }}
        MARKER_COMMENT: ${{ inputs.marker-comment-marker }}
        MAX_WAIT_SECONDS: ${{ inputs.max-wait-seconds }}
        MARKER_TIMEOUT_SECONDS: ${{ inputs.marker-timeout-seconds }}
        MARKER_ACK_TIMEOUT_SECONDS: ${{ inputs.marker-ack-timeout-seconds }}
        MARKER_ACK_TIMEOUT_MAX_SECONDS: ${{ inputs.marker-ack-timeout-max-seconds }}
        COMPLETION_SIGNAL_BUFFER_SECONDS: ${{ inputs.completion-signal-buffer-seconds }}
        FAILED_FINDINGS_RECOVERY_INPUT: ${{ inputs.failed-findings-recovery }}
        FAILED_FINDINGS_RECOVERY_MODE_INPUT: ${{ inputs.failed-findings-recovery-mode }}
        POLL_INTERVAL_SECONDS: ${{ inputs.poll-interval-seconds }}
        BOOTSTRAP_GRACE_SECONDS: ${{ inputs.bootstrap-grace-seconds }}
        BOOTSTRAP_TIMEOUT_SECONDS: ${{ inputs.bootstrap-timeout-seconds }}
        EVENT_MODE_INPUT: ${{ inputs.event-mode }}
        CODEX_BOT_LOGINS: ${{ inputs.codex-bot-logins }}
        TRUSTED_COMMENT_LOGINS: ${{ inputs.trusted-comment-logins }}
      run: node "$GITHUB_ACTION_PATH/src/gate.mjs"
    - name: Upload producer receipt
      id: upload-producer-receipt
      if: ${{ always() && steps.gate.outputs.producer-receipt-finalized == 'true' }}
      uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
      with:
        name: codex-review-gate-producer-receipt-${{ github.run_id }}-${{ github.run_attempt }}
        path: ${{ runner.temp }}/codex-review-gate-producer-receipt.json
        if-no-files-found: error
        compression-level: 0
        overwrite: false
        include-hidden-files: false
