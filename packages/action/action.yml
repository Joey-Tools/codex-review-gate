name: Codex Review Gate
description: Reconcile trusted OpenAI Codex review evidence for one pull request.
author: JoeyTeng
branding:
  icon: shield
  color: blue

inputs:
  github_token:
    description: Token used to read pull-request evidence, update diagnostics, and write the gate status.
    required: true
  pr_number:
    description: Canonical positive pull request number to reconcile.
    required: true
  expected_head_sha:
    description: Exact full pull-request head SHA required by workflow_dispatch; provider events bind their initial current head.
    required: false
    default: ""
  operation:
    description: "Closed operation: reconcile or begin-review."
    required: false
    default: reconcile
  request_comment_id:
    description: Optional untrusted issue-comment selector hint; it never supplies authority or skips full reconciliation.
    required: false
    default: ""
  request_review:
    description: Whether begin-review should post a best-effort OpenAI Codex review request.
    required: false
    default: "true"
  limits_profile:
    description: "Closed reviewed evidence-limits profile: default or expanded."
    required: false
    default: default

outputs:
  execution_health:
    description: "Runtime health: healthy or unhealthy."
  gate_outcome:
    description: "Gate result: success, failure, pending, not_applicable, or unknown."
  recovery_code:
    description: Stable machine-readable next-action code.
  retry_safe:
    description: Whether an immediate identical-input retry is a valid recovery action.

runs:
  using: node20
  main: src/v2/gate-runtime.mjs
