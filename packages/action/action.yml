name: Codex Review Gate v2 Plan Adapter
description: >-
  Read a complete Codex review snapshot and produce closed v2 effect plans.
  This low-level Action never posts comments or commit statuses and does not
  complete the gate by itself; ordinary consumers must call the trusted
  reusable workflow.
author: JoeyTeng
branding:
  icon: shield
  color: blue

inputs:
  github-token:
    description: Token used only for complete read transport by this plan-only adapter.
    required: true
  pull-request:
    description: Canonical positive pull request number.
    required: true
  operation:
    description: "Closed operation: prepare-request, bind-request, or evaluate-only."
    required: true
  status-target-mode:
    description: "Closed mode: head or test-merge-with-head-sentinel."
    required: true
  operation-input-path:
    description: >-
      Absolute path under runner.temp to controller-generated canonical JSON.
      Checkout and pull-request-controlled files are rejected.
    required: true

outputs:
  decision:
    description: Closed v2 reducer decision.
    value: ${{ steps.plan.outputs.decision }}
  result-path:
    description: Runner-temp path to the complete plan-only result.
    value: ${{ steps.plan.outputs.result-path }}
  report-path:
    description: Runner-temp path to the canonical rich public v2 report.
    value: ${{ steps.plan.outputs.report-path }}
  status-plan-path:
    description: Runner-temp path to the scheduler-authorized status plan.
    value: ${{ steps.plan.outputs.status-plan-path }}
  reservation-path:
    description: Runner-temp path to a consumed request reservation, or empty.
    value: ${{ steps.plan.outputs.reservation-path }}
  intent-path:
    description: Runner-temp path to the retry-zero POST intent, or empty.
    value: ${{ steps.plan.outputs.intent-path }}
  binding-receipt-path:
    description: Runner-temp path to the exact-201 binding receipt, or empty.
    value: ${{ steps.plan.outputs.binding-receipt-path }}

runs:
  using: composite
  steps:
    - name: Build closed v2 plans
      id: plan
      shell: bash
      env:
        V2_GITHUB_TOKEN: ${{ inputs.github-token }}
        V2_PULL_REQUEST: ${{ inputs.pull-request }}
        V2_OPERATION: ${{ inputs.operation }}
        V2_STATUS_TARGET_MODE: ${{ inputs.status-target-mode }}
        V2_OPERATION_INPUT_PATH: ${{ inputs.operation-input-path }}
        V2_REST_BASE_URL: ${{ github.api_url }}
        V2_GRAPHQL_URL: ${{ github.graphql_url }}
      run: node "$GITHUB_ACTION_PATH/src/v2/action.mjs"
