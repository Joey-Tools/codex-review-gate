name: Codex Review Gate v2

on:
  workflow_call:
    inputs:
      pull-request:
        description: Pull request number, or empty only for a controller-owned scan.
        required: false
        type: string
        default: ""
      selection-policy:
        description: Closed trusted selection policy; controller routes never select a lane.
        required: true
        type: string
      controller-mode:
        description: Closed controller route selected by this trusted workflow family.
        required: false
        type: string
        default: ordinary
      observation-boundary:
        description: Closed scheduler observation boundary; never provider evidence.
        required: false
        type: string
        default: initial
    outputs:
      decision:
        description: Closed v2 reducer decision.
        value: ${{ jobs.codex-review-gate.outputs.decision }}
      report-path:
        description: Controller-owned canonical rich public report under RUNNER_TEMP.
        value: ${{ jobs.codex-review-gate.outputs.report-path }}
      status-plan-path:
        description: Controller-owned canonical authorized status plan under RUNNER_TEMP.
        value: ${{ jobs.codex-review-gate.outputs.status-plan-path }}
      reservation-path:
        description: Canonical consumed request reservation, or empty.
        value: ${{ jobs.codex-review-gate.outputs.reservation-path }}
      intent-path:
        description: Canonical retry-zero request intent, or empty.
        value: ${{ jobs.codex-review-gate.outputs.intent-path }}
      binding-receipt-path:
        description: Canonical exact-201 request binding receipt, or empty.
        value: ${{ jobs.codex-review-gate.outputs.binding-receipt-path }}
      sticky-receipt-path:
        description: Canonical sticky projection/refetch receipt, or empty.
        value: ${{ jobs.codex-review-gate.outputs.sticky-receipt-path }}
      ledger-receipt-path:
        description: Canonical durable effect-ledger receipt.
        value: ${{ jobs.codex-review-gate.outputs.ledger-receipt-path }}
      due-at:
        description: Next useful controller observation time, or empty.
        value: ${{ jobs.codex-review-gate.outputs.due-at }}
      wakeup-hints:
        description: Closed advisory wakeup hint; never evidence or a verdict.
        value: ${{ jobs.codex-review-gate.outputs.wakeup-hints }}

permissions:
  contents: write
  id-token: write
  issues: write
  pull-requests: write
  statuses: write

jobs:
  codex-review-gate:
    if: inputs.controller-mode != 'scan-all-open'
    name: codex/github-review-gate controller
    runs-on: ubuntu-slim
    timeout-minutes: 5
    outputs:
      decision: ${{ steps.controller.outputs.decision }}
      report-path: ${{ steps.controller.outputs.report-path }}
      status-plan-path: ${{ steps.controller.outputs.status-plan-path }}
      reservation-path: ${{ steps.controller.outputs.reservation-path }}
      intent-path: ${{ steps.controller.outputs.intent-path }}
      binding-receipt-path: ${{ steps.controller.outputs.binding-receipt-path }}
      sticky-receipt-path: ${{ steps.controller.outputs.sticky-receipt-path }}
      ledger-receipt-path: ${{ steps.controller.outputs.ledger-receipt-path }}
      due-at: ${{ steps.controller.outputs.due-at }}
      wakeup-hints: ${{ steps.controller.outputs.wakeup-hints }}
    steps:
      - name: Check out exact called-workflow release
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .codex-review-gate-action
          persist-credentials: false

      - name: Run trusted v2 controller
        id: controller
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          V2_CONTROLLER_EVENT_PATH: ${{ github.event_path }}
          V2_CONTROLLER_INPUT_PATH: ${{ runner.temp }}/codex-review-gate-v2-command.json
          V2_CONTROLLER_OUTPUT_PATH: ${{ runner.temp }}/codex-review-gate-v2-controller-output.json
          V2_CONTROLLER_ROUTE: ${{ inputs.controller-mode }}
          V2_CONTROLLER_OBSERVATION_BOUNDARY: ${{ inputs.observation-boundary }}
          V2_CONTROLLER_PULL_REQUEST: ${{ inputs.pull-request }}
          V2_CONTROLLER_DISPATCH_BINDING: ""
          V2_SELECTION_POLICY: ${{ inputs.selection-policy }}
          V2_STATUS_CONTEXT: codex/github-review-gate
          V2_STATUS_TARGET_MODE: test-merge-with-head-sentinel
          V2_PUBLIC_WAIT_PREFLIGHT_REQUIRED: "true"
          V2_PUBLIC_WAIT_MINUTES: "15"
          V2_PUBLIC_WAIT_ENVIRONMENT_INITIAL: codex-review-gate-public-initial-15m
          V2_PUBLIC_WAIT_ENVIRONMENT_POST_REQUEST: codex-review-gate-public-post-request-15m
          V2_PUBLIC_WAIT_ENVIRONMENT_NO_START: codex-review-gate-public-no-start-15m
          V2_EXPECTED_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          V2_ACTUAL_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          V2_EXPECTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
          V2_EXPECTED_WORKFLOW_PATH: .github/workflows/codex-review-gate.yml
          V2_CHECKED_OUT_RELEASE_SHA: ${{ steps.checkout.outputs.commit }}
        run: |
          set -euo pipefail
          test "$V2_CHECKED_OUT_RELEASE_SHA" = "$V2_EXPECTED_WORKFLOW_SHA"
          node "$GITHUB_WORKSPACE/.codex-review-gate-action/src/v2/workflow-controller.mjs" prepare-command
          node "$GITHUB_WORKSPACE/.codex-review-gate-action/src/v2/workflow-controller.mjs" run
          test -s "$V2_CONTROLLER_OUTPUT_PATH"

  schedule-dispatch:
    if: inputs.controller-mode == 'scan-all-open'
    name: codex/github-review-gate schedule coordinator
    runs-on: ubuntu-slim
    timeout-minutes: 15
    outputs:
      matrix: ${{ steps.controller.outputs.matrix }}
    steps:
      - name: Check out exact called-workflow release
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .codex-review-gate-action
          persist-credentials: false

      - name: Build durable scheduled pull-request matrix
        id: controller
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          V2_CONTROLLER_EVENT_PATH: ${{ github.event_path }}
          V2_CONTROLLER_INPUT_PATH: ${{ runner.temp }}/codex-review-gate-v2-schedule-command.json
          V2_CONTROLLER_OUTPUT_PATH: ${{ runner.temp }}/codex-review-gate-v2-schedule-output.json
          V2_CONTROLLER_ROUTE: scan-all-open
          V2_CONTROLLER_OBSERVATION_BOUNDARY: initial
          V2_CONTROLLER_PULL_REQUEST: ""
          V2_CONTROLLER_DISPATCH_BINDING: ""
          V2_SELECTION_POLICY: ${{ inputs.selection-policy }}
          V2_STATUS_CONTEXT: codex/github-review-gate
          V2_STATUS_TARGET_MODE: test-merge-with-head-sentinel
          V2_PUBLIC_WAIT_PREFLIGHT_REQUIRED: "true"
          V2_PUBLIC_WAIT_MINUTES: "15"
          V2_PUBLIC_WAIT_ENVIRONMENT_INITIAL: codex-review-gate-public-initial-15m
          V2_PUBLIC_WAIT_ENVIRONMENT_POST_REQUEST: codex-review-gate-public-post-request-15m
          V2_PUBLIC_WAIT_ENVIRONMENT_NO_START: codex-review-gate-public-no-start-15m
          V2_EXPECTED_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          V2_ACTUAL_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          V2_EXPECTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
          V2_EXPECTED_WORKFLOW_PATH: .github/workflows/codex-review-gate.yml
          V2_CHECKED_OUT_RELEASE_SHA: ${{ steps.checkout.outputs.commit }}
        run: |
          set -euo pipefail
          test "$V2_CHECKED_OUT_RELEASE_SHA" = "$V2_EXPECTED_WORKFLOW_SHA"
          node "$GITHUB_WORKSPACE/.codex-review-gate-action/src/v2/workflow-controller.mjs" prepare-command
          node "$GITHUB_WORKSPACE/.codex-review-gate-action/src/v2/workflow-controller.mjs" schedule-dispatch

  scheduled-pull-requests:
    if: inputs.controller-mode == 'scan-all-open'
    name: codex/github-review-gate scheduled PR ${{ matrix.pull_request }}
    needs: schedule-dispatch
    runs-on: ubuntu-slim
    timeout-minutes: 5
    strategy:
      fail-fast: false
      max-parallel: 1
      matrix: ${{ fromJSON(needs.schedule-dispatch.outputs.matrix) }}
    steps:
      - name: Check out exact called-workflow release
        if: matrix.enabled
        id: checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          repository: ${{ job.workflow_repository }}
          ref: ${{ job.workflow_sha }}
          path: .codex-review-gate-action
          persist-credentials: false

      - name: Run trusted v2 scheduled controller
        if: matrix.enabled
        id: controller
        shell: bash
        env:
          GITHUB_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_EVENT_NAME: ${{ github.event_name }}
          GITHUB_REF: ${{ github.ref }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          GITHUB_RUN_ATTEMPT: ${{ github.run_attempt }}
          GITHUB_ACTOR_ID: ${{ github.actor_id }}
          GITHUB_WORKFLOW_REF: ${{ github.workflow_ref }}
          GITHUB_WORKFLOW_SHA: ${{ github.workflow_sha }}
          V2_CONTROLLER_EVENT_PATH: ${{ github.event_path }}
          V2_CONTROLLER_INPUT_PATH: ${{ runner.temp }}/codex-review-gate-v2-scheduled-command.json
          V2_CONTROLLER_OUTPUT_PATH: ${{ runner.temp }}/codex-review-gate-v2-scheduled-output.json
          V2_CONTROLLER_ROUTE: ordinary
          V2_CONTROLLER_OBSERVATION_BOUNDARY: initial
          V2_CONTROLLER_PULL_REQUEST: ${{ matrix.pull_request }}
          V2_CONTROLLER_DISPATCH_BINDING: ${{ matrix.dispatch_binding }}
          V2_SELECTION_POLICY: ${{ inputs.selection-policy }}
          V2_STATUS_CONTEXT: codex/github-review-gate
          V2_STATUS_TARGET_MODE: test-merge-with-head-sentinel
          V2_PUBLIC_WAIT_PREFLIGHT_REQUIRED: "true"
          V2_PUBLIC_WAIT_MINUTES: "15"
          V2_PUBLIC_WAIT_ENVIRONMENT_INITIAL: codex-review-gate-public-initial-15m
          V2_PUBLIC_WAIT_ENVIRONMENT_POST_REQUEST: codex-review-gate-public-post-request-15m
          V2_PUBLIC_WAIT_ENVIRONMENT_NO_START: codex-review-gate-public-no-start-15m
          V2_EXPECTED_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          V2_ACTUAL_WORKFLOW_REPOSITORY: ${{ job.workflow_repository }}
          V2_EXPECTED_WORKFLOW_SHA: ${{ job.workflow_sha }}
          V2_EXPECTED_WORKFLOW_PATH: .github/workflows/codex-review-gate.yml
          V2_CHECKED_OUT_RELEASE_SHA: ${{ steps.checkout.outputs.commit }}
        run: |
          set -euo pipefail
          test "$V2_CHECKED_OUT_RELEASE_SHA" = "$V2_EXPECTED_WORKFLOW_SHA"
          node "$GITHUB_WORKSPACE/.codex-review-gate-action/src/v2/workflow-controller.mjs" prepare-command
          node "$GITHUB_WORKSPACE/.codex-review-gate-action/src/v2/workflow-controller.mjs" run
          test -s "$V2_CONTROLLER_OUTPUT_PATH"
